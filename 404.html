<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Kevin Sotka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#10110f;--paper:#f4f1e8;--acid:#d7ff3f;--orange:#ff6a35;
      --serif:Georgia,"Times New Roman",serif;
      --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--ink);color:var(--paper);
      font-family:var(--sans);line-height:1.45;display:grid;place-items:center;padding:40px 24px}
    .box{width:min(720px,100%)}
    .kick{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--acid)}
    h1{font-size:clamp(56px,11vw,124px);line-height:.88;letter-spacing:-.075em;font-weight:900;margin:26px 0 24px}
    h1 em{font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:-.04em}
    p{font-size:19px;max-width:46ch;color:rgba(244,241,232,.74);margin:0 0 32px}
    a.btn{display:inline-flex;padding:15px 22px;border-radius:999px;font-weight:800;font-size:15px;
      border:1px solid var(--acid);background:var(--acid);color:var(--ink);text-decoration:none;
      transition:transform .18s ease}
    a.btn:hover{transform:translateY(-2px)}
  </style>
</head>
<body>
  <div class="box">
    <div class="kick">404 / Nothing here</div>
    <h1>This page <em>does not exist.</em></h1>
    <p>
      Either the address has a typo in it or I moved something and forgot to leave a note.
      Both are recoverable.
    </p>
    <a class="btn" href="/">Back to the start</a>
  </div>
</body>
</html>
